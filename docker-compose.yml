services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escrow_dev}
      POSTGRES_DB: escrow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: escrow_test
      POSTGRES_DB: escrow_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
volumes:
  pgdata:
